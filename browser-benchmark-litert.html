<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noise Suppression Profile Benchmark</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
        line-height: 1.4;
      }
      pre {
        background: #f8f8f8;
        padding: 1rem;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>Noise Suppression Profile Benchmark</h1>
    <p id="status">Preparing benchmark...</p>
    <pre id="summary"></pre>
    <pre id="details"></pre>

    <script type="module">
      import {
        benchmarkNoiseSuppression,
        formatProfileSummary,
      } from "./demo/benchmark-utils.ts";

      (async () => {
        const status = document.getElementById("status");
        const summary = document.getElementById("summary");
        const details = document.getElementById("details");

        try {
          const warmupIterations = 40;
          const benchmarkIterations = 300;
          status.textContent = `Running ${benchmarkIterations} measured calls...`;

          const result = await benchmarkNoiseSuppression({
            label: "profiled runtime",
            warmupIterations,
            benchmarkIterations,
            moduleOptions: {
              enableProfiling: true,
            },
          });

          summary.textContent = formatProfileSummary(result.profile);
          details.textContent = JSON.stringify(
            {
              timings: result.timings,
              modelDetails: result.modelDetails,
              profile: result.profile,
            },
            null,
            2
          );
          status.textContent = "Benchmark complete.";
        } catch (error) {
          console.error(error);
          status.textContent = `Benchmark failed: ${error}`;
        }
      })();
    </script>
  </body>
</html>
