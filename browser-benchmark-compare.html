<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noise Suppression Runtime Compare</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
        line-height: 1.4;
      }
      pre {
        background: #f8f8f8;
        padding: 1rem;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>Noise Suppression Runtime Compare</h1>
    <p id="status">Preparing benchmark...</p>
    <pre id="summary"></pre>
    <pre id="details"></pre>

    <script type="module">
      import {
        benchmarkNoiseSuppression,
        formatTimingSummary,
        maxAbsDiff,
        seededNoise,
      } from "./demo/benchmark-utils.ts";

      (async () => {
        const status = document.getElementById("status");
        const summary = document.getElementById("summary");
        const details = document.getElementById("details");
        const input = seededNoise(512);

        try {
          status.textContent = "Benchmarking forced single-threaded runtime...";
          const singleThreadResult = await benchmarkNoiseSuppression({
            label: "single-threaded",
            input,
            moduleOptions: {
              threads: false,
              numThreads: 1,
            },
          });

          status.textContent = "Benchmarking threaded runtime...";
          const threadedResult = await benchmarkNoiseSuppression({
            label: "threaded",
            input,
            moduleOptions: {
              threads: true,
              numThreads: 4,
            },
          });

          const maxDifference = maxAbsDiff(
            singleThreadResult.output,
            threadedResult.output
          );
          const speedup =
            singleThreadResult.timings.meanMs / threadedResult.timings.meanMs;

          summary.textContent = [
            formatTimingSummary(singleThreadResult),
            "",
            formatTimingSummary(threadedResult),
            "",
            `speedup (single-thread / threaded): ${speedup.toFixed(2)}x`,
            `max abs output diff: ${maxDifference.toExponential(6)}`,
            `crossOriginIsolated: ${String(globalThis.crossOriginIsolated)}`,
          ].join("\n");

          details.textContent = JSON.stringify(
            {
              singleThreaded: singleThreadResult,
              threaded: threadedResult,
              speedup,
              maxDifference,
            },
            null,
            2
          );
          status.textContent = "Comparison complete.";
        } catch (error) {
          console.error(error);
          status.textContent = `Comparison failed: ${error}`;
        }
      })();
    </script>
  </body>
</html>
